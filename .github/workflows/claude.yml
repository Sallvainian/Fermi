name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # write, so an @claude task can commit and push a fix rather than only
      # describe one. With `contents: read` the action cannot write to a branch.
      # Anything that can post `@claude` on an issue or PR comment can now reach
      # a branch through this job.
      contents: write
      # write (not read) on both: this workflow answers by posting a comment, on
      # issues as well as PRs, which the read-only defaults silently forbid. The
      # action's own docs/setup.md shows write for each.
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Without these the prompt's verify commands below cannot run — this job
      # otherwise checks out the repo and nothing else. Same Node as test.yml.
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-5-5 --effort high'

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Project rules are NOT duplicated here. The action's injected system
          # prompt already says "Always check for and follow the repository's
          # CLAUDE.md file(s)", so this prompt points at them instead. Inlining a
          # copy means two places to keep in sync and one of them going stale.
          prompt: |
            ## Fermi

            Fermi is a web app: a Vite + React app in `app/` on Supabase
            (`supabase/`: migrations, pgTAP tests, edge functions). Read
            `AGENTS.md` before changing behavior it covers; it is the source for
            this repo's policy, layout and conventions. The legacy mobile tree
            outside `app/` and `supabase/` is being retired: do not change it
            unless the task says to.

            ### Before you claim it works

            Dependencies in `app/` are installed already. Run, from the repo
            root, what your change touches:

            - `npm --prefix app run lint` — ESLint
            - `npm --prefix app run typecheck` — `tsc -b --force`
            - `npm --prefix app run test:unit` — Vitest
            - `node scripts/check-migrations.ts` — the expand-only check, when you
              add or edit a file in `supabase/migrations/`

            pgTAP (`supabase test db`), Playwright and `deno test` are NOT
            runnable in this job: it has no local Supabase stack, no browsers and
            no Deno. A change they cover is unverified unless you say how you
            checked it.

            Do NOT claim on-device coverage. This job has no device or
            browser, so nothing here exercises the app as a user runs it.

            If you could not verify something, say so plainly rather than
            implying it passed.

            ---

            Now execute the task from the comment that tagged you.
