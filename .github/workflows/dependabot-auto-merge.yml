# Enable GitHub auto-merge for every Dependabot PR, majors included.
# The Main ruleset requires "Test Summary" and "Dependency Review", which is
# what `--auto` waits on. A merge here does not deploy; deploy.yml's daily run
# does.

name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge for Dependabot PRs
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh pr merge --auto --squash "$PR_URL"; then
            exit 0
          fi
          # --auto is refused when the PR is already mergeable. Only squash
          # immediately if every other check has already finished green.
          pending=$(gh pr checks "$PR_URL" --json name,bucket --jq \
            '[.[] | select(.name != "dependabot") | select(.bucket == "pending" or .bucket == "fail" or .bucket == "cancel")] | length')
          if [ "$pending" -eq 0 ]; then
            gh pr merge --squash "$PR_URL"
            exit 0
          fi
          echo "Auto-merge could not be enabled and other checks are not all green."
          exit 1
