# Tests: every test kind, on every pull request and push to main (story 3, R5).
# Generated by TEA (Test Architect) CI setup, on My-Love's test.yml as the model.
# Stack: fullstack (Vite + React app in app/, Supabase in supabase/)
# Frameworks: ESLint + tsc, Vitest, pgTAP, deno test, Playwright (+ Playwright Utils)
#
# Merge gate (AD-23): Test Summary is the one check from this file the Main
# ruleset requires (story 13). Every lane that must block a merge is a job
# here that Test Summary waits on, added to its `needs` in the same change
# that adds the lane. This file reads no repo or environment secret and tests
# against the local Supabase stack only, so Dependabot pull requests run every
# lane.

name: Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Sundays 02:00 UTC: the full suite plus a burn-in of every Playwright
    # spec, since a pull request only burns in the specs it affects.
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  # The weekly scheduled run gets its own group, so a merge to main during it
  # cannot cancel that week's only full burn-in.
  group: tests-${{ github.ref }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # Fails under 80% line coverage of app/src/api/ (vitest.config.ts).
      - name: Vitest with coverage
        run: npm run test:unit:coverage
        env:
          # Shuffle seed: a new order each run, replayable with SEED=<run number>.
          SEED: ${{ github.run_number }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: app/coverage/
          retention-days: 7

  db-tests:
    name: Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Applies every migration to a fresh local database, so a migration that
      # does not apply fails here too.
      - name: Setup Supabase Local
        uses: ./.github/actions/setup-supabase

      - name: pgTAP
        run: supabase test db

      # Calls public.job_health through the local Data API with the demo secret key; no repo secret.
      - name: check-job-health.sh passes and fails as it should
        run: scripts/test-check-job-health.sh

      # Dumps the local stack, restores it into a throwaway database and
      # encrypts it to a fresh key; the weekly backup.yml runs the same scripts
      # against the hosted project. No repo secret.
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: backup scripts pass and fail as they should
        run: scripts/test-backup.sh

  function-tests:
    name: Edge Function Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # Every folder in supabase/functions, each handler.ts's tests beside it
      # (AD-5), and _shared/*.ts's beside them. --no-lock: a bare run writes a
      # deno.lock that could change what `supabase functions deploy` resolves.
      # The guard stays for a checkout without the folder.
      - name: deno test
        run: |
          if [ ! -d supabase/functions ]; then
            echo "supabase/functions does not exist yet: no edge functions to test."
            exit 0
          fi
          deno test --no-lock --permit-no-files supabase/functions

  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.node-version

      # Fails a migration that drops or renames a table, view, column,
      # function or schema, or changes a function's arguments (AD-20). A
      # planned contract step starts with `-- contract: <reason>`.
      - name: Expand-only check
        run: node scripts/check-migrations.ts

  # The deploy health checks. scripts/check-site.sh against the built shell
  # served by vite preview: it must pass for the build's own id and fail for a
  # stale id, a missing JavaScript file and an id missing from the JavaScript
  # (DW-2), and for a missing latest.json and a stale latest.json version.
  # scripts/deploy-gate.sh, the daily deploy decision, runs against the same
  # builds: it must print deploy=false only for the live commit.
  # scripts/check-hosted-config.sh against fixture API responses: it must pass
  # for the right Auth and Realtime config and name each wrong setting,
  # including a site_url or redirect URL off the workers.dev origin and an
  # empty redirect list.
  # scripts/write-latest-json.sh against fake builds: it must write only
  # latest.json for the build's own id and refuse an id the build lacks, an
  # unset GITHUB_SHA and a missing build. No secret, no Supabase CLI.
  site-check-tests:
    name: Health Check Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: check-site.sh passes and fails as it should
        run: scripts/test-check-site.sh

      - name: check-hosted-config.sh passes and fails as it should
        run: scripts/test-check-hosted-config.sh

      - name: write-latest-json.sh writes and refuses as it should
        run: scripts/test-write-latest-json.sh

  playwright:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One project failing must not cancel the others: each one's result is
      # evidence.
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browsers: chromium
          - project: webkit
            browsers: webkit
          # apiRequest opens a page, so API specs need Chromium too.
          - project: api
            browsers: chromium
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: ${{ matrix.browsers }}

      - name: Run ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}

      # A green run that quietly ran fewer tests than the suite lists fails here.
      - name: Check every ${{ matrix.project }} test ran
        run: scripts/check-test-counts.sh ${{ matrix.project }} tests/${{ matrix.project == 'api' && 'api' || 'e2e' }}

      - name: Upload ${{ matrix.project }} report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.project }}
          path: |
            app/test-results/
            app/playwright-report/
          retention-days: 14

  burn-in:
    name: Burn-In
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 60 || 30 }}
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          # The burn-in runner diffs against the base branch.
          fetch-depth: 0

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      # Every Playwright spec this pull request changes, or that imports a file
      # it changes, 5 times with no retries (tests/burn-in/burn-in.config.ts).
      # Passes with a message when the change affects no spec.
      - name: Burn in affected specs
        if: github.event_name == 'pull_request'
        env:
          # Security: inputs passed through env: to prevent script injection
          BASE_REF: ${{ github.base_ref }}
        run: npm run test:burn-in -- --base-branch="origin/$BASE_REF"

      - name: Burn in every spec (weekly)
        if: github.event_name == 'schedule'
        run: npx playwright test --repeat-each=5 --retries=0

      - name: Upload burn-in failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: burn-in-failures
          path: |
            app/test-results/
            app/playwright-report/
          retention-days: 7

  # The branch protection target. It always runs and always reports, so a
  # required check is never left pending; it passes only when every lane passed.
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, unit-tests, db-tests, function-tests, migration-check, site-check-tests, playwright, burn-in]
    if: always()
    steps:
      - name: Evaluate results
        env:
          EVENT: ${{ github.event_name }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit-tests.result }}
          DB: ${{ needs.db-tests.result }}
          FUNCTIONS: ${{ needs.function-tests.result }}
          MIGRATIONS: ${{ needs.migration-check.result }}
          SITE_CHECK: ${{ needs.site-check-tests.result }}
          PLAYWRIGHT: ${{ needs.playwright.result }}
          BURN_IN: ${{ needs.burn-in.result }}
        run: |
          rc=0
          check() {  # <label> <result>
            if [ "$2" = "success" ]; then
              echo "$1: success"
            else
              echo "::error::$1: $2"
              rc=1
            fi
          }
          check "Lint & Type Check" "$LINT"
          check "Unit Tests" "$UNIT"
          check "Database Tests" "$DB"
          check "Edge Function Tests" "$FUNCTIONS"
          check "Migration Check" "$MIGRATIONS"
          check "Health Check Tests" "$SITE_CHECK"
          check "Playwright" "$PLAYWRIGHT"

          # Burn-in runs on pull requests and the weekly schedule. Skipped is
          # accepted only on the events where it never runs.
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "schedule" ]; then
            check "Burn-In" "$BURN_IN"
          elif [ "$BURN_IN" = "skipped" ]; then
            echo "Burn-In: skipped (runs on pull requests and the weekly schedule)"
          else
            check "Burn-In" "$BURN_IN"
          fi

          if [ "$rc" -ne 0 ]; then
            echo "One or more lanes did not pass."
            exit 1
          fi
          echo "All lanes passed."
