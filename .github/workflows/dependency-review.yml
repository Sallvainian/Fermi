# Dependency Review: the second check the Main ruleset requires (story 13).
# Fails a pull request that adds a dependency with a known vulnerability of
# moderate severity or worse. No path or branch filter: a required check that
# does not run on a pull request leaves it pending forever.

name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
