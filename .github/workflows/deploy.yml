name: Deploy

on:
  # Every push to main deploys: a docs-only push redeploys the same build, and
  # nothing that should ship can be left out by a forgotten path filter.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      health_check_only:
        description: 'Run only the Health check (site and hosted config); skips migrate, hosted config, edge functions, build and deploy. The site check expects the build of main''s latest commit, so it fails if that commit is not what is live'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: 'deploy'
  cancel-in-progress: false

jobs:
  # Schema before frontend: the build ships code that assumes the current
  # schema, so a frontend that deploys ahead of its migration runs against a
  # database it does not match.
  migrate:
    name: Migrate
    # Production has no deployment-branch policy, so a manual run from another
    # branch must not push its migrations; hosted-config, functions, build, deploy
    # and health-check need this job. A health-check-only run skips it.
    if: github.ref == 'refs/heads/main' && !inputs.health_check_only
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.0

      - name: Link to production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_ID }}

      - name: Show pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "::group::Remote migration history"
          supabase migration list --linked
          echo "::endgroup::"

          # Print what would run before anything writes, so a failed apply has
          # a readable record of what it was attempting.
          echo "::group::Dry run"
          supabase db push --dry-run
          echo "::endgroup::"

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

  # The hosted project's Auth and Realtime config, after the schema. Holds the
  # Management API token and runs no npm code. A skipped migrate (a
  # health-check-only run) skips it too.
  hosted-config:
    name: Hosted config
    needs: migrate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.0

      # config push applies the [remotes.production] block of config.toml whose
      # project_id matches the project it pushes to. Without that match it would
      # push the local-dev defaults over the hosted project's values.
      - name: Check config.toml targets this project
        env:
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          if ! grep -qxF "project_id = \"$PROJECT_ID\"" supabase/config.toml; then
            echo "::error::supabase/config.toml has no [remotes.production] block with project_id = \"$PROJECT_ID\"; config push would not apply it."
            exit 1
          fi

      # Pushes the Auth config in config.toml. Provider secrets join this
      # step's env from Production under the names config.toml's env() entries
      # use; an env() that is unset is not pushed.
      - name: Push the Auth config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: supabase config push --project-ref "$PROJECT_ID" --yes

      # Realtime private-only has no config.toml key. The PATCH is skipped when
      # the setting is already true, so a deploy writes only what changed.
      - name: Set Realtime private-only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -o pipefail
          url="https://api.supabase.com/v1/projects/$PROJECT_ID/config/realtime"
          current="$(curl -sS --fail-with-body --retry 3 --max-time 30 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$url" | jq -c '.private_only')"
          echo "Realtime private_only is $current"
          if [ "$current" = "true" ]; then
            echo "Already private-only; nothing to change."
            exit 0
          fi
          curl -sS --fail-with-body --retry 3 --max-time 30 -X PATCH \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"private_only":true}' "$url"
          echo "Realtime set to private-only."

  # The edge functions, after the schema and config they rely on and before the
  # build ships a frontend that calls them. Holds the Management API token and
  # runs no npm code. A skipped migrate (a health-check-only run) skips it too.
  functions:
    name: Edge functions
    needs: hosted-config
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0

      # Deploys every function folder. _shared is not one (its name starts with
      # an underscore), and with no function folders the CLI would exit 1 with
      # NoFunctionsToDeployError, so this step passes without calling it.
      # --use-api bundles on the Management API, so no Docker. No --prune: a
      # deploy never deletes a function it does not know about.
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          shopt -s nullglob
          functions=()
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            if [[ "$name" =~ ^[A-Za-z][A-Za-z0-9_-]*$ ]]; then
              functions+=("$name")
            fi
          done
          if [ "${#functions[@]}" -eq 0 ]; then
            echo "no edge functions to deploy"
            exit 0
          fi
          echo "Deploying: ${functions[*]}"
          supabase functions deploy --project-ref "$PROJECT_ID" --use-api

  # Runs third-party npm code, so it has no environment and no secrets.
  build:
    name: Build
    needs: functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Without these the build falls back to the local stack (app/src/api/
      # env.ts), which a deployed app must never point at.
      - name: Check the Supabase build variables
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for name in SUPABASE_PROJECT_ID SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository variable $name is empty; the build would not target the hosted project."
              exit 1
            fi
          done

      # GITHUB_SHA is the id vite.config.ts bakes in as __BUILD_ID__ and as the
      # fermi-build meta the health check reads back. The publishable key is
      # public by design.
      - name: Build application
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_ID }}.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: app/dist
          retention-days: 7

  # The secrets live on the Production environment, so only the jobs on it
  # (migrate, hosted-config, functions, deploy, health-check) can read them --
  # not the build. None of them runs a third-party npm install script: this job
  # installs with --ignore-scripts, so no dependency's install script runs
  # beside the token, and the others run no npm code. Only this job references
  # the Cloudflare secrets.
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ vars.SITE_URL }}
    steps:
      # For wrangler.jsonc and the lockfile-pinned wrangler.
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: app/dist

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: app/node_modules/.bin/wrangler deploy

  # Proves this push is what the site serves and that the hosted Auth and
  # Realtime config is what the app assumes. Holds the Management API token
  # (read-only GETs) and runs no npm code. Runs after a green deploy, or alone
  # for a health_check_only dispatch, where migrate, hosted-config, functions,
  # build and deploy are skipped.
  health-check:
    name: Health check
    needs: deploy
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.deploy.result == 'success' || (inputs.health_check_only && needs.deploy.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check the deployed site
        run: scripts/check-site.sh "${{ vars.SITE_URL }}" "$GITHUB_SHA"

      # Runs even when the site check failed, so one run names every wrong thing.
      - name: Check the hosted Auth and Realtime config
        if: ${{ !cancelled() }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: scripts/check-hosted-config.sh "${{ vars.SUPABASE_PROJECT_ID }}"
