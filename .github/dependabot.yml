# Version updates moved to Renovate (renovate.json). Every entry below has
# open-pull-requests-limit: 0, which stops Dependabot's version-update PRs; its
# security-update PRs (a repo setting) still run and still take their commit
# prefix, labels and directories from this file. dependabot-auto-merge.yml merges
# them; Renovate's own security PRs are off because they cannot fix a package
# that appears only in package-lock.json.

# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm dependencies of the app
  - package-ecosystem: 'npm'
    directory: '/app'
    open-pull-requests-limit: 0
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'npm'
    # Dependabot puts a dependency in the first group that matches it, so the
    # order here matters: vitest comes before the two catch-all groups.
    groups:
      # vitest and its companion packages peer-pin each other on an exact
      # version, so a major that arrives as one PR per package can never
      # install. Named explicitly so they always travel together, majors
      # included.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    open-pull-requests-limit: 0
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
