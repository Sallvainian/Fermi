# Epics of the Capacitor Supabase Port, in build order.

[[epic]]
id = 1
slug = "epic-platform-baseline"
title = "The new app ships from CI"
description = "A Capacitor web build and iOS shell live in a new app/ folder beside the untouched Flutter app, the iOS project taking over bundle com.academic-tools.fermi and its build numbers; a new deploy workflow replaces 02_deploy_web.yml and, on a push to main, applies Supabase migrations, deploys edge functions, builds, packages the live update, deploys the fermi-plus Worker (wrangler.toml rewritten to assets only on workers.dev) and passes the health check; access-policy and edge-function tests run in CI; an iOS build installed through TestFlight internal testing offers to restart onto each new deploy. Every later epic builds on this pipeline."
covers = ["R23"]

[[epic]]
id = 2
slug = "epic-invite-sign-in"
title = "Teachers and the admin get in by invite"
description = "On the deployed site and the iOS build, the landing page says access is by invite only, shows how to add Fermi to the Home Screen and links Fermi's existing App Store listing; the admin is made by migration on first Google sign-in and creates teacher codes (R15's teacher-code part); a teacher signs in with a code and Google or Apple; roles are set on the server, nobody changes their own, the admin and teachers land on their dashboards, and users complete their name and upload or remove a profile picture. Owns the upload pattern (type and real byte-size checks, short-lived links) that epics 4 and 5 reuse, and the user directory (who sees whose name, picture and email). Hands accounts, roles and the invite-code model to epic 3, and accounts, the directory and the admin role to epics 5, 9, 10 and 12."
covers = ["R1", "R2", "R3", "R15", "R25"]
after = [{ epic = 1, needs = "the CI pipeline, the Supabase project and the app shell" }]

[[epic]]
id = 3
slug = "epic-classes-rosters"
title = "Teachers run classes and students join them"
description = "A teacher creates, edits, archives and deletes classes and fills each roster by name, one at a time or by CSV; an archived class leaves the main class views and stays under Archived (R21's class part); a student joins with the class code and their name, matched to the roster with claim-once, teacher approval for near matches and undo, and lands on the student dashboard. Delivers R1's student half on epic 2's invite model, and hands classes, membership and the archived flag to epics 4, 5, 7 and 8."
covers = ["R1", "R2", "R4", "R5", "R21"]
after = [{ epic = 2, needs = "accounts, server-set roles and the invite-code model" }]

[[epic]]
id = 4
slug = "epic-assignments-grades"
title = "Assignments, submissions and grades"
description = "On epic 3's classes and membership and epic 2's upload pattern, a teacher publishes assignments with files from the device or Google Drive; enrolled students open them and submit text with files from the device or Drive; the teacher grades; a student sees only their own grades; a teacher sees a class's grade analytics; an archived class's grades stay viewable under Archived (R21's grades part). Hands assignments, submissions and grades to epic 11."
covers = ["R6", "R18", "R21"]
after = [{ epic = 3, needs = "classes, enrollment and the archived flag" }]

[[epic]]
id = 5
slug = "epic-chat"
title = "Chat on one model"
description = "On epic 3's class membership, epic 2's user directory and upload pattern, users chat one-to-one, in groups and in class chats on one chat model, with text and checked attachments up to 10 MB, typing and unread counts; only participants read or post; scheduled messages post at their time; users see who is online. Hands the message event to epic 6 and presence to epic 12."
covers = ["R10", "R12", "R16"]
after = [{ epic = 3, needs = "classes and enrollment for class chats" }]

[[epic]]
id = 6
slug = "epic-notifications"
title = "Notifications reach people"
description = "Users see, mark read and delete their notifications; on the website a notification arriving while Fermi is open shows as a pop-up; a chat message reaches a closed iOS app as a push and, best effort, a closed Home Screen web app as a web push. Opens with a spike that proves web push on the owner's iPhone. Consumes epic 5's message event and hands the notification model to epic 7."
covers = ["R11", "R14", "R17", "R24"]
after = [{ epic = 5, needs = "the chat message event to notify on" }]

[[epic]]
id = 7
slug = "epic-boards-announcements"
title = "Discussion boards and announcements"
description = "On epic 3's classes and membership, teachers create boards; users read, post, reply and like; authors delete their own posts; a teacher's announcement in a class's Announcements board notifies the class through epic 6's notification model. Hands posts to epic 11 for recent activity."
covers = ["R9", "R20"]
after = [{ epic = 3, needs = "classes and membership" }, { epic = 6, needs = "the notification model" }]

[[epic]]
id = 8
slug = "epic-behavior-points"
title = "Behavior points"
description = "On epic 3's classes and membership, a teacher manages a class's behaviors, awards and undoes points, and sees totals and filtered history; a student sees only their own points and history. Hands points to epic 11 for recent activity."
covers = ["R7"]
after = [{ epic = 3, needs = "classes and enrollment" }]

[[epic]]
id = 9
slug = "epic-calendar"
title = "Calendar"
description = "A user creates calendar events and sees the events they created or were added to."
covers = ["R8"]
after = [{ epic = 2, needs = "accounts" }]

[[epic]]
id = 10
slug = "epic-contact"
title = "Support reports and Gmail"
description = "A user submits a support or bug report, and the admin reads them in a reports list this epic adds; a user opens Gmail's compose screen from inside Fermi with the recipient filled in from epic 2's user directory when started from a Fermi user."
covers = ["R13", "R22"]
after = [{ epic = 2, needs = "accounts, the user directory and the admin role" }]

[[epic]]
id = 11
slug = "epic-dashboards"
title = "Dashboards show real data"
description = "A teacher's dashboard shows assignment stats and recent activity; a student's shows upcoming assignments, recent grades, assignment stats and GPA; every widget reads data epics 4, 7 and 8 write, and writes none of its own."
covers = ["R19"]
after = [{ epic = 4, needs = "assignments, submissions and grades" }, { epic = 7, needs = "posts for recent activity" }, { epic = 8, needs = "points for recent activity" }]

[[epic]]
id = 12
slug = "epic-admin-console"
title = "Admin console"
description = "The admin lists users with counts by role and online (from epic 5's presence) and deletes any account but their own, the delete following the shared account-delete rule. Delivers R15's rest beside epic 2's teacher codes."
covers = ["R15"]
after = [{ epic = 2, needs = "accounts and the admin role" }, { epic = 5, needs = "presence for the online count" }]

[[epic]]
id = 13
slug = "epic-app-store-release"
title = "Release on the App Store and retire Flutter"
description = "The iOS app passes App Store review as an update to com.academic-tools.fermi with Sign in with Apple and a reviewer invite code; the Flutter app, functions/, Firebase config, src/index.js, the email worker, workflows 01_ci, 03, 04 and 05 and the Cloudflare Pages project fermi are removed; a per-role walkthrough on the website, the Home Screen web app and the App Store app shows R1 to R25 working."
covers = []
after = [{ epic = 4, needs = "R6, R18 and R21 deployed for the walkthrough" }, { epic = 6, needs = "R11, R14, R17 and R24 deployed, push working in the iOS build" }, { epic = 7, needs = "R9 and R20 deployed" }, { epic = 9, needs = "R8 deployed" }, { epic = 10, needs = "R13 and R22 deployed" }, { epic = 11, needs = "R19 deployed" }, { epic = 12, needs = "R15 complete" }]
