# Stories of epic-platform-baseline, in build order.

[[entry]]
id = 1
type = "story"
title = "The empty app ships to workers.dev from a push to main"
description = "Delivers R2's migrate, build, deploy and site-check part, R3, and R7's schemas part. Scaffolds app/ (Vite, React, React Router, TypeScript, Tailwind, Zustand, zod, supabase-js and Capacitor core, CLI and iOS at the Stack's pinned versions, with ESLint and typecheck) as a shell page that shows the build's commit id; adds supabase/config.toml with [auth] enable_signup = false and a first migration creating the empty app and internal schemas, not exposed by the Data API; adds an assets-only wrangler.jsonc for the Worker fermi-plus on workers.dev and a deploy.yml that runs migrate, build, wrangler deploy and an HTTP health check; deletes 02_deploy_web.yml, wrangler.toml and src/index.js, and deletes the Flutter-era root package.json and package-lock.json (wrangler is pinned in app/ instead), and README.md's CI/CD list item 2 (02_deploy_web.yml). Delivers R11: rewrites .github/dependabot.yml on My-Love's model (/Users/sallvain/Projects/My-Love/.github/dependabot.yml): npm at /app, with the native group (@capacitor/*, @capgo/* and every Capacitor plugin, all update types; the one list of native packages, AD-18) and the vitest group (vitest and @vitest/*, majors included) listed before the minor/patch production and dev groups, since Dependabot puts a package in the first group it matches, commit prefix deps with scope; github-actions grouped minor/patch, prefix ci with scope; no pub, no gradle and none of My-Love's preactjs ignore. Delivers R10's Cloudflare part: once deploy.yml has run green from the Production environment's secrets, deletes the repo-level CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Setup, done 2026-11-06 as My-Love did it: the GitHub environment Production holds CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD for project mzbblbgmrvcgvzxwhptm, and the repo variables are SITE_URL (https://fermi-plus.sallvain.workers.dev/) and SUPABASE_PROJECT_ID; deploy.yml's job runs in environment Production; the first wrangler deploy creates the Worker. Hands the scaffold, the pinned dependency set and deploy.yml to every later story, and dependabot.yml to stories 9 and 13."
verify = "After a push to main, fermi-plus.sallvain.workers.dev shows the shell with that push's commit id, the run shows migrate, build, deploy and health check green, and wrangler.toml, src/index.js, 02_deploy_web.yml and the root package.json are gone from main; Dependabot shows its /app npm and github-actions version-update jobs with no errors (security-update runs on functions/ stay red until epic-app-store-release deletes it), and gh secret list shows no CLOUDFLARE_ secret at repo level."
covers = ["R2", "R3", "R7", "R10", "R11"]
after = []
hitl = false
risk = "high"

[[entry]]
id = 12
type = "story"
title = "The dead Flutter-era workflows and their secrets are gone"
description = "Delivers R10's workflow part and R13's part for what it deletes. Deletes 01_ci.yml, 03_windows_release.yml, 04_macos_release.yml and 05_Ignore_desktop-release.yml, and the repo secrets only they use: ANTHROPIC_API_KEY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD, CSC_LINK, CSC_KEY_PASSWORD, FIREBASE_PROJECT_ID, FIREBASE_FUNCTIONS_REGION, GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET. Removes README.md's CI/CD list items 1 (01_ci.yml) and 3 (Platform Releases), which describe them; the Claude workflows' 01_ci mentions are story 13's. Pull requests then run no CI until story 3's test.yml, and claude.yml and claude-code-review.yml still install Flutter until story 13. Setup, done 2026-11-06: the owner approved the ten secret deletions and they are deleted; the build deletes only the workflow files and README items. Needs nothing from other stories."
