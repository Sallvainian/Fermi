[[entry]]
id = 9
type = "story"
title = "Each deploy publishes a live update with its minimum native build"
description = "Delivers R1's packaging part, R2's live-update and latest.json-check part, and R12's live-within-a-day part. Adds scripts/package-live-update.sh, which zips the build and writes updates/latest.json with version (the commit id baked into the build), url, checksum and min_native_build read from story 2's MIN_NATIVE_BUILD file, and refuses a build whose id does not match or whose MIN_NATIVE_BUILD is above the Xcode project's build number; adds a test.yml job, which Test Summary waits on from the same change (AD-23), that fails a pull request changing app/ios/, capacitor.config or a package of dependabot.yml's native group in app/package.json without raising MIN_NATIVE_BUILD, or whose MIN_NATIVE_BUILD is above the Xcode project's build number, reading that group as its package list, never its own (AD-18); deploy.yml runs it after the build; the health check asserts latest.json is served as JSON, not the SPA fallback; deploy.yml also runs once a day and stops before migrate when updates/latest.json already shows main's latest commit, because a Dependabot pull request merged by story 13's auto-merge starts no deploy (GitHub starts no workflow from its own token's changes). Builds on story 5's deploy.yml, story 3's test.yml and Test Summary, and story 1's dependabot.yml; hands latest.json to story 10."
verify = "After a push to main, fermi-plus.sallvain.workers.dev/updates/latest.json shows that push's commit id, a url whose zip matches the checksum, and min_native_build equal to the checked-in value; a pull request that adds a Capacitor plugin without raising MIN_NATIVE_BUILD, or that raises MIN_NATIVE_BUILD above the Xcode build number, fails Test Summary; a manual run of the daily trigger stops at its skip step while latest.json shows main's commit, and deploys when main is ahead."
covers = ["R1", "R2", "R12"]
after = [2, 5]
hitl = false
risk = "medium"

[[entry]]
id = 10
type = "story"
title = "The iOS app offers to restart onto each new deploy"
description = "Delivers R1's in-app part. Adds @capgo/capacitor-updater (no Capgo account, stats off) and a native-update service that checks latest.json on launch, downloads a newer bundle in the background, offers to restart onto it, and skips a bundle whose min_native_build is above the app's own build; every plugin call is guarded with Capacitor.isPluginAvailable and the web build loads no updater. It reads the app's own build number through @capacitor/app (App.getInfo's build), added in the same native change as the updater and in the native group by its @capacitor/ scope. When it skips a bundle, the app shows a banner at the top of the screen, 'A new version of Fermi+ is in the App Store', with Update and Not now, when it opens or returns from the background, Not now hiding it until the next day; Update opens Fermi's listing, https://apps.apple.com/app/id6751152901 (id from Apple's public lookup of bundle com.academic-tools.fermi, 2026-11-06), and the app stays usable on its current bundle; the banner itself is web code (AD-18). Adding the plugin is a native change, so it raises MIN_NATIVE_BUILD and needs a new native build (AD-18). Tests: Vitest for the check and skip rules and for the banner: shown on open and on return from the background after a skip, hidden until the next day after Not now, absent when nothing was skipped, and Update opening the listing URL. The build runs the Simulator check itself, opening the Simulator with xcodebuild and simctl as story 2 does: no hand step, and no operator action after the merge."
verify = "In the iOS Simulator, launched by the build, the app built from the branch (its commit id differs from the live one) offers to restart onto the live update at https://fermi-plus.sallvain.workers.dev/updates/latest.json and after restarting shows the live commit id; served a latest.json whose min_native_build is above the installed build, it brings no offer but the App Store banner on opening and on returning to the app, whose Update button opens the listing URL (in Safari, since the Simulator has no App Store app) and whose Not now leaves the app usable, and a min_native_build at or below the installed build brings the offer back. Screenshots from simctl show each screen."
covers = ["R1"]
after = [2, 9]
hitl = false
risk = "high"
notes = ["Decision: 2026-11-07, the owner turned hitl off: the build proves the story in the iOS Simulator on its own, against the live update story 9 publishes, and the story owes no operator action after the merge."]

[[entry]]
id = 14
type = "story"
title = "The iOS app and its native-build machinery are gone"
description = "Delivers R4, and R2's, R11's and R12's parts for what it removes, because the owner dropped the iPhone app and Capacitor (initiative Decision 2026-11-07). Removes what stories 2 and 9 built for the iOS app: app/ios, app/capacitor.config.ts (and its include in app/tsconfig.node.json), app/eslint.config.js's ios/** ignore, app/MIN_NATIVE_BUILD, and @capacitor/core, @capacitor/ios and @capacitor/cli from app/package.json and its lockfile; scripts/check-native-build.sh, scripts/test-check-native-build.sh, scripts/ios-sim-check.sh and scripts/ocr-text.swift, which only ios-sim-check.sh uses, and their calls in scripts/ci-local.sh; test.yml's native-build-check job, taken out of Test Summary's needs in the same change (AD-23); dependabot.yml's native group, and dependabot-auto-merge.yml's native hold with scripts/dependabot-native-hold.sh and scripts/test-dependabot-native-hold.sh, so every Dependabot pull request merges itself once both required checks pass. scripts/package-live-update.sh stops zipping the build and checking a native build: it writes updates/latest.json with version only (the commit id baked into the build), which deploy.yml's daily skip step (scripts/deploy-gate.sh) and the health check still read; scripts/check-site.sh stops checking the zip url, checksum and min_native_build, and still fails a missing latest.json, one served as the SPA fallback, or a stale version; its tests in scripts/test-check-site.sh follow, and package-live-update.sh's own refusals (a build id that does not match, no build, the id missing from the assets), tested today only in scripts/test-check-native-build.sh, move to a test that stays and runs in a test.yml job Test Summary waits on (AD-23), with app/tests/README.md's rows following. Updates what describes the removed parts: app/tests/README.md's native-build rows and check-site row, deploy.yml's comments (its opening comment's 'a docs-only push redeploys the same build' is corrected: every push writes a new version, and only a change under app/ will bring clients the refresh page, once story 16 adds the app id, AD-24), the claude.yml and claude-code-review.yml prompts (the Capacitor plugin guard, the native-change rule, app/ios as generated files), app/playwright.config.ts's Capacitor-shell comment, the iPhone-era wording in app/tests/support/helpers/staff-session.ts (lines 5, 8 and 15: staff sign in with Google only, AD-7, and admission is checked by hand on the deployed site, not in the Simulator), app/tests/README.md (line 46, the same two phrases) and claude.yml (line 95: the job has no device or browser, not 'no device or simulator'), and, through bmad-project-context, AGENTS.md: Fermi is a web app on Supabase, and the three native-build policy lines go. Leaves the Flutter app's ios/ and scripts/ios_build.sh to epic-app-store-release. Also closes deferred items DW-4 and DW-8 (deferred-work.md) as obsolete: the Info.plist and the MIN_NATIVE_BUILD rule they concern are gone. May rename scripts/package-live-update.sh, which no longer packages a live update, to scripts/write-latest-json.sh, with every caller, test and doc that names it in the same change. Setup, done 2026-11-07: the architect amended the spine through bmad-architecture (d98e518): AD-18 retired, AD-21's live-update packaging, AD-23's MIN_NATIVE_BUILD lane and native-group exception, the Tests convention, the Stack and the Structural Seed, so hitl is off. Hands the version-only latest.json to story 16."
verify = "On main after the merge, git ls-files shows no app/ios, capacitor.config or MIN_NATIVE_BUILD and app/package.json no @capacitor package; grep -rniE 'capacitor|MIN_NATIVE_BUILD|native[- ](group|hold|build)' over app (without node_modules), scripts, .github and AGENTS.md, minus the initiative folder name initiative-capacitor-supabase-port, finds nothing, and git grep -niE 'simulator|apple' -- app scripts .github AGENTS.md ':!scripts/ios_build.sh' (tracked files only, the Flutter app's build script excluded) finds nothing; the next push's deploy is green with https://fermi-plus.sallvain.workers.dev/updates/latest.json showing that push's commit id and no zip under updates/; a manual run of the daily trigger stops at its skip step; the site-check tests fail a stale version and pass the right one, and the packaging tests fail a mismatched build id; Test Summary passes without a native-build job."
covers = ["R2", "R4", "R11", "R12"]
after = [2, 9, 13]
hitl = false
risk = "medium"
notes = ["Decision: 2026-11-07, closes DW-4 and DW-8 at the replan; the build's plan declares closes_deferred: [DW-4, DW-8] in its frontmatter so bmad-loop marks both done when the story lands.", "Decision: 2026-11-07, the architect's spine amendment landed (d98e518), so hitl is off; the rename of package-live-update.sh is the build's choice, and if made, the spine's AD-24 and Structural Seed name the old path until the architect next amends them."]

[[entry]]
id = 18
type = "story"
title = "The hosted sign-in returns to the workers.dev site, not localhost"
description = "Delivers R2's site_url part (AD-7, AD-21). supabase/config.toml's [remotes.production.auth] sets site_url to http://localhost:3000 and additional_redirect_urls to [] today (checked 2026-11-07), so a hosted Google sign-in would send the user back to localhost. Sets site_url to https://fermi-plus.sallvain.workers.dev and additional_redirect_urls to that origin's paths only (for example https://fermi-plus.sallvain.workers.dev/**), which story 4's config push applies; the local [auth] block keeps its 127.0.0.1 values. scripts/check-hosted-config.sh also fails, naming the wrong value, unless the hosted site_url equals that origin and every hosted redirect URL is on it; scripts/test-check-hosted-config.sh, whose fixture uses a localhost site_url today, covers the right values, a localhost site_url, a redirect URL on another origin, and an empty redirect list, which fails, since AD-7 lists that origin's paths and Google sign-in's return needs one (the Management API reports redirect URLs as one comma-separated string, uri_allow_list). Leaves deploy.yml's comments to story 14. Uses story 4's config push and health check; hands the pinned origin to epic-invite-sign-in's Google sign-in."
verify = "After a push to main, the health check's log shows site_url equal to https://fermi-plus.sallvain.workers.dev and every redirect URL on that origin; with site_url changed in the Supabase dashboard, a manual run of the health check alone fails naming it, and the next push to main sets it back and passes; CI shows the hosted-config tests failing a localhost site_url, a redirect URL on another origin and an empty redirect list."
covers = ["R2"]
after = [4]
