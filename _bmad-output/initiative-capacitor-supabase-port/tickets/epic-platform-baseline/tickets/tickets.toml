[[entry]]
id = 3
type = "story"
title = "Every test kind runs in CI and fails the run"
description = "Delivers R5's CI-lane part and R7's pgtap part, built by running TEA's test framework setup with its CI scope (bmad-tea-framework, framework and CI together) to My-Love's standard. Enables pgtap in a migration with a first pgTAP test asserting the app and internal schemas exist and anon has no usage on them; adds test.yml, run on every pull request and push: ESLint and typecheck, Vitest with coverage, pgTAP through supabase test db on a local stack at CLI 2.122.0, deno test over every folder in supabase/functions (none yet; story 5 adds the first), and Playwright on Desktop Chrome and iPhone WebKit against the built shell, with My-Love's checks that every test ran and its burn-in of changed specs, each failing the run when it fails. test.yml reads no repo or environment secret and runs every lane against the local stack only, so Dependabot pull requests run them all (AD-23). Points .mcp.json's playwright-test server at app/'s Playwright (My-Love runs the same server from its root, where its Playwright is installed). The framework follows the system-level test design in _bmad-output/test-artifacts/test-design/ (2026-11-06) and settles its four open items: (1) a helper that signs in a teacher or the admin lives only in test code, runs only against the local Supabase stack with that stack's own service-role key, and refuses to run when the Supabase URL is not 127.0.0.1 or localhost; nothing in the app, its edge functions or the hosted config adds a test-only sign-in; (2) one shared test-user fixture module that later epics extend (epic-invite-sign-in adds the admin and teachers, epic-classes-rosters the classes, enrolled, removed and archived cases) instead of each epic inventing users; (3) a test.yml step that fails a migration dropping or renaming a table, column or function, or changing an RPC's arguments (AD-20's expand-then-contract rule); (4) the convention that every scheduled job takes the current time as a parameter, so tests never wait on the clock. Staff signed in by the helper skip the teacher-list check, so admission is tested only by the database tests of the sign-in gate (the test design's P0-003) and by hand in the Simulator. Setup (hitl): the system-level bmad-tea-test-design run on the initiative was done 2026-11-06; the owner ran the TEA framework session by hand on 2026-11-06, following that plan, and its work is committed (d709727); the build completes the story on top of it. test.yml ends in one summary job named Test Summary that waits on every lane and passes only when each passes, as My-Love's; a lane added later joins its needs in the same change (AD-23); story 13 makes it a required check. Uses story 1's scaffold; hands the lanes stories 5, 6 and 7 add tests to, test.yml and its summary job to story 9, which adds a job to it, and the summary job to story 13. Also closes deferred items DW-2 and DW-3 (deferred-work.md). DW-2: test.yml runs scripts/check-site.sh against the built shell served locally, once with the build's own id, which must pass, and once for each failure it guards (a stale id, its JavaScript file answered as HTML, the id missing from that JavaScript), each of which must fail. DW-3: the first pgTAP test asserts that neither anon nor authenticated has usage on app or internal, and a test.yml step fails the run when the local stack's Data API serves either schema, so adding one to [api] schemas fails CI."
verify = "A pull request with one failing ESLint rule, Vitest test, pgTAP test and Playwright test shows a red run naming each failed job; reverting it turns the run green; test.yml names no secret; the staff sign-in helper refuses to run against a non-local Supabase URL, and a migration that drops a column fails the run; the site check passes against the built shell with the right id and fails for a stale id, a missing JavaScript file and an id missing from the JavaScript; and a pull request granting authenticated usage on app, or adding internal to [api] schemas, fails the run."
covers = ["R5", "R7"]
after = [1]
hitl = false
risk = "medium"
notes = ["Decision: 2026-11-06, takes DW-2 and DW-3 from deferred-work.md at the owner's request, since both wait on this story's lanes; the build's plan declares closes_deferred: [DW-2, DW-3] in its frontmatter so bmad-loop marks both done when the story lands.", "Decision: 2026-11-06, the hand step (the TEA framework session) is done and committed as d709727, so hitl is off and bmad-loop builds the rest of the story on top of it."]

[[entry]]
id = 13
type = "story"
title = "Main merges only on green CI, and the Claude workflows target the new app"
description = "Delivers R12, except its live-within-a-day part (story 9's), and R13's Claude-workflow part, in this order: points the Main ruleset at the default branch only (today it targets every branch, ~ALL, which blocks Dependabot's own branches); adds dependency-review.yml on My-Love's model, its job named Dependency Review (every pull request, no path filter so it always reports, fail-on-severity moderate, summary comment); makes the ruleset require exactly two checks, Test Summary (story 3's) and Dependency Review (AD-23); adds dependabot-auto-merge.yml on My-Love's model, which merges a Dependabot pull request once both required checks pass, except one changing a package of dependabot.yml's native group, matched by that group's package patterns, not the pull request's group, so an ungrouped security update is held too, which the owner merges by hand after raising MIN_NATIVE_BUILD (AD-18), and only now that both are required, since without them a pull request merges untested. A merge by auto-merge starts no deploy; story 9's daily run deploys it. Retargets claude.yml and claude-code-review.yml to app/ and supabase/: their prompts name the new stack's checks and test commands, and their Flutter setup and 01_ci.yml mentions go. Removes README.md's CI/CD list item 4 (Code Review Automation). Runs bmad-project-context to record in AGENTS.md that Playwright tests use the @seontechnologies/playwright-utils fixtures story 3 set up, a vanilla Playwright equivalent needing a stated reason; that every check that must block a merge is a test.yml job Test Summary waits on and test.yml reads no secret (AD-23); and that a new Capacitor plugin joins dependabot.yml's native group in the same change and a native change raises both MIN_NATIVE_BUILD and the Xcode build number (AD-18); and that a native-group pull request stays open until the next planned App Store build, unless it fixes a security advisory. Setup, done 2026-11-06: the owner approved the ruleset change, and the repo's Allow auto-merge setting is on (gh pr merge --auto fails without it). Uses story 3's summary job, story 1's dependabot.yml and its native group, and comes after story 12, which edits the same README list."
verify = "gh api shows the Main ruleset targets only the default branch and requires exactly Test Summary and Dependency Review; a pull request with a failing test, or adding a package with a moderate advisory, cannot be merged; a Dependabot pull request outside the native group merges itself after both pass, and one changing a native-group package does not, grouped or not; a Claude review of a pull request touching app/ runs with no Flutter step; AGENTS.md states the Playwright Utils, merge-gate and native-group rules."
covers = ["R12", "R13"]
after = [3, 12]
hitl = false
risk = "medium"

