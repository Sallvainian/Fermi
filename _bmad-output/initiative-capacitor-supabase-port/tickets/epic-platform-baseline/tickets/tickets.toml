[[entry]]
id = 2
type = "story"
title = "The iOS shell runs in the Simulator under Fermi's bundle"
description = "Delivers R4. Adds the Capacitor iOS project in app/ios for bundle com.academic-tools.fermi and team W778837A9L, with version 1.0.0 (MARKETING_VERSION, above the live 0.9.3; the unreleased 1.0.0 uploads hold builds 1 and 2) and build number 8, above the highest App Store Connect holds (7, in 0.9.1; checked 2026-11-06, when the live App Store version was 0.9.3), and records that build as MIN_NATIVE_BUILD in one checked-in file, kept apart from the Xcode build number, which may go higher; MIN_NATIVE_BUILD goes up only with a native change (AD-18). Setup, done 2026-11-06: the owner looked up the build numbers in App Store Connect. The build opens the app in an iOS Simulator with xcodebuild and simctl, which needs no signing, and checks a screenshot for the commit id. Uses story 1's scaffold; hands the native project and MIN_NATIVE_BUILD to stories 9 and 10."
