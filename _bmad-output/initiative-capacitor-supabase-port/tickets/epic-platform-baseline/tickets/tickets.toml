[[entry]]
id = 15
type = "story"
title = "Fermi installs to the Home Screen as Fermi+"
description = "Delivers R14. The site serves a web app manifest (name and short_name Fermi+, display standalone, start_url and scope /, background and theme colours) linked from app/index.html, with apple-touch-icon and manifest icons at 180, 192 and 512 pixels made from Fermi's own icon, the Flutter app's ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png (1024 pixels, checked 2026-11-07), never a placeholder; index.html also sets apple-mobile-web-app-title to Fermi+. The icons sit in app/public so wrangler serves them as static assets. Tests: Vitest or Playwright on iPhone WebKit asserts index.html links the manifest and the touch icon, the manifest parses with those fields, and every icon it names is served as a PNG of its stated size. Also closes deferred item DW-5 (deferred-work.md): its concern, a placeholder replacing Fermi's icon, moves from the removed iOS project to the Home Screen icon. Uses story 1's scaffold and deploy; hands the manifest to epic-invite-sign-in's landing page (R25's Home Screen steps) and epic-notifications' web push (R11)."
verify = "After a push to main, https://fermi-plus.sallvain.workers.dev/manifest.webmanifest (or the path index.html links) is served as JSON with name Fermi+ and display standalone, and its icons and the apple-touch-icon load as PNGs; on the owner's iPhone, Share then Add to Home Screen in Safari offers Fermi+ with Fermi's icon, and the saved icon opens Fermi with no Safari bar."
covers = ["R14"]
after = [1, 3]
hitl = false
risk = "low"
notes = ["Decision: 2026-11-07, closes DW-5 at the replan; the build's plan declares closes_deferred: [DW-5] in its frontmatter.", "Decision: 2026-11-07, the iPhone half of the verify is the owner's, after the merge; the build proves the manifest and icons with the automated tests."]

[[entry]]
id = 17
type = "story"
title = "Typing survives the refresh, and the refresh waits for work in progress"
description = "Delivers R15 (AD-26) and R16's registry part (AD-24). Adds the one draft hook in app/src/ and draftKey(feature, ...scopeIds, field), the only builder of draft keys, as fermi:draft:<user id>:…, with feature one of the app/src/features/<area> folders, kept as a typed list in draftKey's module that each epic extends when it adds its folder (the tests use a fixture feature) and a new row's key carrying its parent's id (new:<parent id>). The hook stores any JSON value (text, numbers, dates, selects) in sessionStorage, written on each change, so it lives only in that tab or Home Screen web app; it reads and writes only after the session has resolved, and keeps nothing while signed out; the session check and the SIGNED_OUT listener go in app/src/api/auth.ts, where AD-27 places epic-invite-sign-in's signOut(), beside story 5's client. It tells the form when a value was restored, so the form can show a Discard control, and clears a draft on send, save, cancel or Discard. It refuses File and Blob values; for picked files it keeps only their names, so a form can ask for them again and block sending until each is picked or removed; passwords never go through it. A wipe of every fermi:draft: key is exported for epic-invite-sign-in's signOut() (AD-27) and also runs on every SIGNED_OUT auth event in each tab. Adds the one busy registry in app/src/: a multi-call or upload flow (a CSV import, an upload, a send) registers while it runs and is released when it ends or fails, and the registry reports whether any work is held; story 16's refresh page waits on it. No form in this epic uses either; later epics' content forms and uploads do (epic map seams Drafts and Busy registry). Tests: Vitest for draftKey (shape, an unknown feature refused), the hook (written on change, restored after a remount, sessionStorage and never localStorage, nothing before the session resolves or while signed out, the restored flag, cleared on send, save, cancel and Discard, a File refused, file names kept), the wipe on SIGNED_OUT, and the registry (held while work runs, released on success and on failure, two flows at once). Uses story 5's client; hands the hook, draftKey, the wipe and the registry to story 16 and to every later epic."
verify = "CI's Vitest lane shows the draft hook, draftKey, wipe and busy registry cases passing, including a value restored after a remount, nothing kept while signed out, a SIGNED_OUT event wiping every fermi:draft: key, and the registry released after a failed flow; a grep of app/src finds no fermi:draft: key built outside draftKey."
covers = ["R15", "R16"]
after = [5]
hitl = false
risk = "medium"

[[entry]]
id = 16
type = "story"
title = "A Fermi on an old build is replaced by the refresh page"
description = "Delivers R1 and R16's waiting part, and R2's app-id part (AD-24). deploy.yml computes the app id once, git rev-parse HEAD:app (the tree hash of app/, which works on its shallow checkout), beside the version it already has, and passes it to the build, which bakes it in as __APP_ID__, and to scripts/package-live-update.sh (or the name story 14 gave it), which then writes updates/latest.json as { \"version\": \"…\", \"app\": \"…\" } and nothing else. The app fetches /updates/latest.json (absolute path, cache: 'no-store') when Fermi starts, on visibilitychange to visible, on pageshow and online, every 15 minutes while on screen, and at once on a failed dynamic import or AD-20's stale-client errors (PGRST202, PGRST204, 42883, 42703) through story 5's app/src/api/; it exports the check so epic-invite-sign-in's realtime.ts runs it on an unknown event. A failed or malformed fetch, or one without app, shows nothing, and so does a new version with the same app. When app differs from __APP_ID__, the refresh page renders at the root in place of the router and every provider, so subscriptions and timers stop: full screen, cannot be dismissed, needs no session, and shows only 'A new version of Fermi+ is ready. Refresh to keep using Fermi+.' and one Refresh button. While story 17's busy registry holds work, the page waits for it, at most 2 minutes. Refresh reloads the current URL, so story 17's drafts come back; if the reload comes back on the same build, the next check waits 30 seconds. It runs the same in a browser tab and in the Home Screen web app, with no plugin and no service worker (AD-25). Delivers R2's cache part: scripts/check-site.sh, the health check, also fails unless / and /updates/latest.json are served with max-age=0 in Cache-Control (AD-21), so a Refresh always reaches the new index.html; scripts/test-check-site.sh covers a missing Cache-Control and a max-age above 0 on each. Tests: Vitest for the check (same app, different app, a new version with the same app, failed fetch, malformed JSON, no app field; each trigger, the 15-minute timer with fake timers, each stale-client code, the 30-second wait) and the page (only the text and the button, no way to dismiss it, the router not rendered, waiting while the registry holds work and showing at 2 minutes); a Playwright spec on Desktop Chrome and iPhone WebKit that serves a latest.json naming another app id and sees only the refresh page, then after Refresh sees the page request index.html again and a value kept under a fermi:draft: key still in sessionStorage. Uses story 14's version-only latest.json and its check-site.sh, and story 17's busy registry and draft store; story 9's deploy publishes it."
verify = "After a push to main that changes app/, https://fermi-plus.sallvain.workers.dev/updates/latest.json shows that push's commit as version and the tree hash of its app/ as app, and a tab and the owner's Home Screen web app open on the previous build each show only the refresh page when they next come back on screen or within 15 minutes; Refresh brings up the build showing the new commit id; after a push that changes only _bmad-output/, neither shows the page; the deploy's health check log shows max-age=0 passing for / and /updates/latest.json; CI shows the Vitest and Playwright cases and the site-check tests for a missing or nonzero max-age passing."
covers = ["R1", "R2", "R16"]
after = [14, 17]
hitl = false
risk = "medium"
notes = ["Decision: 2026-11-07, the iPhone half of the verify is the owner's, after the merge, with the spine's hand check of the update check, the refresh page and draft restore after the Home Screen web app returns from suspension; the build proves the page with the automated tests.", "Decision: 2026-11-07, ticket sync: rewritten from the dismissible banner with Reload and Not now to AD-24's full-screen refresh page; risk raised to medium because it can stop every user and holds AD-20's one-deploy contract."]

